[package]
name = "clipboard-app"
version = "2.0.0"
edition = "2021"
# version / authors / repository 會在編譯時讀進程式，顯示在「關於」視窗
authors = ["YuCMochi"]
repository = "https://github.com/YuCMochi/Clipboard"

# exe 名稱沿用 C# 版：升級時檔名不變，開機自動啟動的登錄檔項目才不會失效
[[bin]]
name = "ClipboardApp"
path = "src/main.rs"

[dependencies]
clipboard-win = "5"
winreg = "0.52"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
